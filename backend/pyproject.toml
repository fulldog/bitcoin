[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-crypto-quant"
version = "0.1.0"
description = "A safety-first personal Binance spot quantitative trading platform"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.29,<1",
  "redis>=5,<6",
  "httpx>=0.27,<1",
  "websockets>=13,<14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.7,<1",
  "mypy>=1.13,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["B008", "RUF007", "RUF012"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
